[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dbbest-clinical-schema"
version = "1.0.0"
description = "Shared schema, builders, validators and parsers for the dbBEST clinical-data ecosystem."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "dbBEST" }]
dependencies = [
  "pydantic>=2.6,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dbbest_clinical_schema"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
